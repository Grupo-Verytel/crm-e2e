<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CRM Frisson ↔ MEP-LEAN — OpenAPI</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css"
    />
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: '/openapi/crm-mep.yaml',
        dom_id: '#swagger-ui',
        persistAuthorization: true,
        deepLinking: true,
        tryItOutEnabled: true,
        plugins: [
          function currentHostServer() {
            return {
              statePlugins: {
                spec: {
                  wrapActions: {
                    updateJsonSpec: function (origAction) {
                      return function (spec) {
                        if (spec && Array.isArray(spec.servers)) {
                          spec = Object.assign({}, spec, {
                            servers: [
                              {
                                url: window.location.origin,
                                description: 'Este servidor',
                              },
                            ].concat(spec.servers),
                          });
                        }
                        return origAction(spec);
                      };
                    },
                  },
                },
              },
            };
          },
        ],
      });
    </script>
  </body>
</html>
